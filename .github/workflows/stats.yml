# 📈 Gera os cards de estatísticas do README dentro do próprio repositório
# (substitui o github-readme-stats, que vive fora do ar).
# Roda todo dia de madrugada e pode ser disparado à mão na aba Actions.

name: Gerar estatísticas

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do pênalti: os dois commitam no README, então nunca rodam juntos.
concurrency:
  group: readme-bot
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards
        env:
          # Opcional: crie um secret STATS_TOKEN (PAT com escopo read:user)
          # para contar também contribuições privadas. Sem ele usa o token padrão.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
        run: python3 stats/gerar_stats.py

      - name: Salvar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "📈 atualiza estatísticas"
            git pull --rebase
            git push
          fi
