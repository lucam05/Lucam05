# Workflow da "cobrinha" de contribuições (usado na Opção 1, mas funciona em qualquer uma)
# Onde colocar: no repositório Lucam05 → .github/workflows/snake.yml
# Depois: aba Actions → "Gerar cobrinha" → Run workflow (a 1ª vez manual).
# Ele cria a branch "output" com os SVGs que o README referencia.

name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12h
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write             # necessário para publicar na branch output

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Gera os SVGs a partir do seu gráfico de contribuições
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publica a pasta dist/ na branch "output"
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
